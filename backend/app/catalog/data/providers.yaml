# Provider + model catalog — the source of truth the canvas renders from.
#
# Hand-authored rather than introspected: ModelRegistry gives slugs and pricing
# but no labels, ranges, or UI grouping, and the property panel needs those.
# tests/unit/test_catalog.py asserts every adapter path is well-formed so this
# file cannot silently drift.
#
# Param names are per-provider on purpose (Veo takes `duration_seconds`, GMI and
# Runway take `duration`) — GenBlaze normalizes per connector, not globally.

providers:
  - key: mock
    label: Mock (no API key)
    always_available: true
    models:
      - id: mock-video-v1
        label: Mock Video
        modality: video
        adapter: app.engine.mock_providers:video_provider
        expected_duration_sec: 5
        est_cost_usd: 0
        output_media_type: video/mp4
        # The mock adapter is ours and ignores its inputs, so it can safely
        # declare the full port rail — that is what gives the canvas something
        # to demo without claiming capabilities a real provider has not been
        # verified to have.
        accepts:
          - {port: init_image, via: external_inputs, modality: image}
          - {port: end_frame, via: external_inputs, modality: image}
          - {port: image_ref, via: external_inputs, modality: image}
        params:
          - {name: duration, type: integer, label: Duration, unit: s, default: 5, min: 1, max: 10, step: 1}
          - name: aspect_ratio
            type: enum
            label: Aspect ratio
            default: "16:9"
            options:
              - {value: "16:9"}
              - {value: "9:16"}
              - {value: "1:1"}

      - id: mock-image-v1
        label: Mock Image
        modality: image
        adapter: app.engine.mock_providers:image_provider
        expected_duration_sec: 2
        est_cost_usd: 0
        output_media_type: image/png
        # No init_image: image generation here is text-to-image only. The port
        # is a video-model concept (the literal first frame) and offering it on
        # an image node would draw a handle nothing consumes.
        accepts:
          - {port: image_ref, via: external_inputs, modality: image}
        params:
          - name: aspect_ratio
            type: enum
            label: Aspect ratio
            default: "16:9"
            options:
              - {value: "16:9"}
              - {value: "9:16"}
              - {value: "1:1"}

      - id: mock-lipsync-v1
        label: Mock Lip Sync
        modality: video
        role: lipsync
        adapter: app.engine.mock_providers:video_provider
        expected_duration_sec: 6
        est_cost_usd: 0
        output_media_type: video/mp4
        # No aspect_ratio param: the output inherits the avatar's framing, so
        # there is nothing for the user to pick. `output_aspect_ratio` is what
        # the canvas previews instead.
        output_aspect_ratio: "1:1"
        # Driven by its ports, not by text.
        requires_prompt: false
        accepts:
          - {port: avatar, via: external_inputs, modality: image}
          - {port: speech, via: external_inputs, modality: audio}
        params: []

      - id: mock-audio-v1
        label: Mock Audio
        modality: audio
        role: music
        adapter: app.engine.mock_providers:audio_provider
        expected_duration_sec: 3
        est_cost_usd: 0
        output_media_type: audio/mpeg
        params:
          - {name: duration, type: integer, label: Duration, unit: s, default: 8, min: 1, max: 60, step: 1}

      # The keyless other end of the lipsync chain. Without it the `speech` port
      # is only reachable from ElevenLabs or an upload, so the flow the mock
      # provider exists to demonstrate — speak, then drive a face with it —
      # would need a credential to draw at all.
      # Text in, text out: the node that rewrites a rough idea into a prompt
      # worth spending a generation on. Mock-only for now — genblaze-google and
      # genblaze-openai ship LLM-capable packages, but neither is installed
      # here, and this file does not claim a provider class it has not seen.
      - id: mock-llm-v1
        label: Mock Prompt Writer
        modality: text
        role: llm
        adapter: app.engine.mock_providers:text_provider
        expected_duration_sec: 2
        est_cost_usd: 0
        output_media_type: text/plain
        params:
          - name: target
            type: enum
            label: Write for
            help: Which kind of generation the rewritten prompt is aimed at.
            default: image
            options: [{value: image}, {value: video}, {value: audio}]
          - {name: temperature, type: number, label: Temperature, default: 0.7, min: 0, max: 1, step: 0.1, group: advanced}

      - id: mock-speech-v1
        label: Mock Speech
        modality: audio
        role: speech
        adapter: app.engine.mock_providers:audio_provider
        expected_duration_sec: 3
        est_cost_usd: 0
        output_media_type: audio/mpeg
        params: []

  - key: google
    label: Google
    package: genblaze_google
    extra: google
    env_var: GEMINI_API_KEY
    signup_url: https://aistudio.google.com/apikey
    models:
      - id: veo-3.0-generate-001
        label: Veo 3
        modality: video
        adapter: genblaze_google:VeoProvider
        expected_duration_sec: 120
        output_media_type: video/mp4
        accepts:
          - {port: init_image, via: external_inputs, modality: image}
        params:
          - {name: duration_seconds, type: integer, label: Duration, unit: s, default: 8, min: 4, max: 8, step: 1}
          - name: aspect_ratio
            type: enum
            label: Aspect ratio
            default: "16:9"
            options: [{value: "16:9"}, {value: "9:16"}]
          - name: resolution
            type: enum
            label: Resolution
            default: "720p"
            options: [{value: "720p"}, {value: "1080p"}]
          - {name: enhance_prompt, type: boolean, label: Enhance prompt, default: true, group: advanced}
          - {name: negative_prompt, type: string, label: Negative prompt, group: advanced, max_length: 500}

      - id: imagen-4.0-generate-001
        label: Imagen 4
        modality: image
        adapter: genblaze_google:ImagenProvider
        expected_duration_sec: 15
        output_media_type: image/png
        params:
          - name: aspect_ratio
            type: enum
            label: Aspect ratio
            default: "16:9"
            options:
              - {value: "16:9"}
              - {value: "9:16"}
              - {value: "1:1"}
              - {value: "4:3"}
              - {value: "3:4"}

  - key: replicate
    label: Replicate
    package: genblaze_replicate
    extra: replicate
    env_var: REPLICATE_API_TOKEN
    signup_url: https://replicate.com/account/api-tokens
    # Image only in GenBlaze — the Replicate adapter has no video path.
    models:
      - id: black-forest-labs/flux-schnell
        label: FLUX Schnell
        modality: image
        adapter: genblaze_replicate:ReplicateProvider
        expected_duration_sec: 10
        output_media_type: image/webp
        params:
          - name: aspect_ratio
            type: enum
            label: Aspect ratio
            default: "16:9"
            options: [{value: "16:9"}, {value: "9:16"}, {value: "1:1"}, {value: "4:3"}, {value: "3:4"}]
          - {name: num_outputs, type: integer, label: Outputs, default: 1, min: 1, max: 4, step: 1, group: advanced}

      - id: black-forest-labs/flux-dev
        label: FLUX Dev
        modality: image
        adapter: genblaze_replicate:ReplicateProvider
        expected_duration_sec: 25
        output_media_type: image/webp
        params:
          - name: aspect_ratio
            type: enum
            label: Aspect ratio
            default: "16:9"
            options: [{value: "16:9"}, {value: "9:16"}, {value: "1:1"}]

  - key: runway
    label: Runway
    package: genblaze_runway
    extra: runway
    env_var: RUNWAYML_API_SECRET
    signup_url: https://dev.runwayml.com/
    # Video only. Populates preview_url during generation — live node thumbnails.
    models:
      - id: gen4_turbo
        label: Gen-4 Turbo
        modality: video
        adapter: genblaze_runway:RunwayProvider
        expected_duration_sec: 90
        output_media_type: video/mp4
        accepts:
          - {port: init_image, via: external_inputs, modality: image}
        params:
          - name: duration
            type: enum
            label: Duration
            unit: s
            default: "5"
            options: [{value: "5"}, {value: "10"}]
          - name: aspect_ratio
            type: enum
            label: Aspect ratio
            default: "16:9"
            options: [{value: "16:9"}, {value: "9:16"}]

  - key: luma
    label: Luma
    package: genblaze_luma
    extra: luma
    env_var: LUMAAI_API_KEY
    signup_url: https://lumalabs.ai/dream-machine/api
    models:
      - id: ray-2
        label: Dream Machine Ray 2
        modality: video
        adapter: genblaze_luma:LumaProvider
        expected_duration_sec: 120
        output_media_type: video/mp4
        params:
          - name: aspect_ratio
            type: enum
            label: Aspect ratio
            default: "16:9"
            options: [{value: "16:9"}, {value: "9:16"}, {value: "1:1"}]

      - id: ray-flash-2
        label: Dream Machine Ray Flash 2
        modality: video
        adapter: genblaze_luma:LumaProvider
        expected_duration_sec: 60
        output_media_type: video/mp4
        params:
          - name: aspect_ratio
            type: enum
            label: Aspect ratio
            default: "16:9"
            options: [{value: "16:9"}, {value: "9:16"}, {value: "1:1"}]

  - key: elevenlabs
    label: ElevenLabs
    package: genblaze_elevenlabs
    extra: elevenlabs
    env_var: ELEVENLABS_API_KEY
    signup_url: https://elevenlabs.io/app/settings/api-keys
    models:
      - id: eleven_multilingual_v2
        label: Multilingual v2 (TTS)
        modality: audio
        role: speech
        adapter: genblaze_elevenlabs:ElevenLabsTTSProvider
        expected_duration_sec: 15
        output_media_type: audio/mpeg
        params:
          - {name: voice_id, type: string, label: Voice ID, default: JBFqnCBsd6RMkjVDRZzb, required: true}
          - name: output_format
            type: enum
            label: Format
            default: mp3_44100_128
            group: advanced
            options: [{value: mp3_44100_128}, {value: mp3_22050_32}]

      - id: eleven_text_to_sound_v2
        label: Sound Effects
        modality: audio
        role: sfx
        adapter: genblaze_elevenlabs:ElevenLabsSFXProvider
        expected_duration_sec: 15
        output_media_type: audio/mpeg
        params:
          - {name: duration_seconds, type: number, label: Duration, unit: s, default: 5, min: 0.5, max: 22, step: 0.5}

  - key: gmicloud
    label: GMI Cloud
    package: genblaze_gmicloud
    extra: gmicloud
    env_var: GMI_API_KEY
    signup_url: https://console.gmicloud.ai/
    models:
      - id: Kling-Text2Video-V2.1-Master
        label: Kling 2.1 (text to video)
        modality: video
        adapter: genblaze_gmicloud:GMICloudVideoProvider
        expected_duration_sec: 180
        output_media_type: video/mp4
        params:
          - {name: duration, type: integer, label: Duration, unit: s, default: 5, min: 5, max: 10, step: 5}
          - name: aspect_ratio
            type: enum
            label: Aspect ratio
            default: "16:9"
            options: [{value: "16:9"}, {value: "9:16"}, {value: "1:1"}]

      - id: Kling-Image2Video-V2.1-Master
        label: Kling 2.1 (image to video)
        modality: video
        adapter: genblaze_gmicloud:GMICloudVideoProvider
        expected_duration_sec: 180
        output_media_type: video/mp4
        accepts:
          - {port: init_image, via: external_inputs, modality: image}
        params:
          - {name: duration, type: integer, label: Duration, unit: s, default: 5, min: 5, max: 10, step: 5}
