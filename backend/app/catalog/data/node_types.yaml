# Canvas palette. Ports are server-declared so the frontend never hardcodes them.
#
# `generate` is special: its output modality and whether it exposes an
# `init_image` port depend on the selected model, so the compiler resolves those
# from providers.yaml at validate time. What is declared here is the base shape.
#
# modality "any" means the port accepts any modality and takes its effective
# type from whatever is connected.

node_types:
  - kind: input.text
    label: Text
    category: input
    description: A prompt or text value feeding one or more generate nodes.
    inputs: []
    outputs:
      - {id: out, modality: text}
    default_data: {text: ""}

  - kind: input.upload
    label: Upload
    category: input
    description: An image, video, or audio file you uploaded. Ingested to B2 with its own provenance manifest.
    inputs: []
    outputs:
      - {id: out, modality: any}
    default_data: {asset_id: null}

  - kind: generate
    label: Generate
    category: generate
    description: One generation step — provider, model, prompt, parameters.
    inputs:
      - {id: prompt, modality: text, required: false, multi: false}
      # `init_image` is the first-frame conditioning image; the canvas labels it
      # "Start frame" on video nodes and "Init image" on image nodes.
      - {id: init_image, modality: image, required: false, multi: false, model_gated: true}
      - {id: end_frame, modality: image, required: false, multi: false, model_gated: true}
      # Lipsync pair: the face to drive, and the speech that drives it. Both
      # model_gated, so they surface only on models that declare them.
      - {id: avatar, modality: image, required: false, multi: false, model_gated: true}
      # `roles` narrows this past its modality: sound effects are audio too
      # and don't drive a mouth or a performance, but speech and music both
      # do (an avatar can sing). An upload still passes — it carries no role,
      # and an uploaded voice recording is the other half of how this port is
      # meant to be filled.
      - {id: speech, modality: audio, required: false, multi: false, model_gated: true, roles: [speech, music]}
      # The track a music model covers or continues. Role-gated for the same
      # reason as `speech`: narration or a sound effect is not source music,
      # but an upload (roleless) always passes.
      - {id: source_audio, modality: audio, required: false, multi: false, model_gated: true, roles: [music]}
      # Reference images (style, subject, wardrobe). Multi because the canonical
      # case is several references conditioning one generation.
      - {id: image_ref, modality: image, required: false, multi: true, model_gated: true}
      # The video being edited, for video-to-video models (Decart's Lucy line
      # is edit-only: the output's framing and length follow this input).
      - {id: source_video, modality: video, required: false, multi: false, model_gated: true}
    outputs:
      - {id: out, modality: any}
    default_data:
      provider: mock
      model: mock-video-v1
      modality: video
      prompt: null
      params: {}
      fallback_models: []

  - kind: transform.composite
    label: Composition
    category: transform
    description: Lays a video track under one or more audio tracks — music, speech, sound effects or uploads — and mixes them to a single MP4 with ffmpeg.
    inputs:
      # `multi` on both: a track is a timeline, so several sources can sit on
      # one, each becoming a clip the user positions in time.
      - {id: video, modality: video, required: true, multi: true}
      # A template, not a handle: the node expands it into `audio_<track id>`
      # for each lane it carries, so every fader has a port of its own. Not
      # `required` per lane — an empty lane is just an empty lane — but the
      # compiler does insist on at least one lane being connected.
      - {id: audio, modality: audio, required: false, multi: true, per_track: true}
    outputs:
      - {id: out, modality: video}
    default_data:
      op: mux
      timeline_sec: 30.0
      video: {id: video, label: null, gain: 1.0, muted: false, clips: []}
      tracks:
        - {id: a1, label: null, gain: 1.0, muted: false, clips: []}

  - kind: output
    label: Output
    category: output
    description: Marks a result to surface in the run summary and asset library.
    inputs:
      - {id: in, modality: any, required: true, multi: false}
    outputs: []
    default_data: {label: null}
