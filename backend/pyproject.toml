[project]
name = "assetflow-backend"
version = "0.1.0"
description = "asset-flow backend — compiles canvas graphs into GenBlaze pipelines"
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly: a minor bump that changes astream() kwargs costs a day.
    "genblaze==0.4.3",
    "fastapi>=0.128",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "sse-starlette>=2.2",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "structlog>=24",
    "orjson>=3.10",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Provider adapters are opt-in; the app runs in mock mode without any of them.
providers = [
    "genblaze-elevenlabs>=0.3.1,<0.4",
    "genblaze-replicate>=0.3.3,<0.4",
    "genblaze-runway>=0.3.1,<0.4",
    "genblaze-luma>=0.3.1,<0.4",
    "genblaze-gmicloud>=0.3.3,<0.4",
    "genblaze-decart>=0.3.2,<0.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "respx>=0.22",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# BLE is on deliberately: catching bare Exception is right in a few places
# (readiness probes, provider construction) and wrong everywhere else, so each
# one should carry an explicit noqa explaining why.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Query/Depends-in-defaults is the framework idiom.
"app/routers/*" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "b2: requires real Backblaze B2 credentials (skipped by default)",
]

[tool.uv]
package = false
